<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      /* The page inherits the viewer's theme. The English text left in the
         markup is the fallback if a translation is missing. */
      :root {
        --fg: #111;
        --muted: #666;
        --faint: #888;
        --empty: #aaa;
        --line: #ddd;
        --line-soft: #f0f0f0;
        --field-bg: #fff;
        --field-fg: #111;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f2f2f2;
          --muted: #a9a9a9;
          --faint: #909090;
          --empty: #777;
          --line: #3d3d3d;
          --line-soft: #2c2c2c;
          --field-bg: #2a2a2a;
          --field-fg: #f2f2f2;
        }
      }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        font-size: 14px;
        color: var(--fg);
        background: transparent;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.intro {
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.4;
      }
      h2 {
        font-size: 15px;
        margin: 20px 0 4px;
      }
      .zone {
        border-top: 1px solid var(--line);
        padding-top: 4px;
      }
      .role {
        margin: 0 0 14px 0;
      }
      .role h3 {
        font-size: 11px;
        color: var(--faint);
        margin: 10px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 6px;
      }
      td {
        padding: 6px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      td.trash {
        width: 32px;
        text-align: right;
      }
      button.trash {
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 15px;
        padding: 0;
        color: inherit;
      }
      select {
        width: 100%;
        padding: 6px;
        color: var(--field-fg);
        background: var(--field-bg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .empty {
        color: var(--empty);
        font-style: italic;
        padding: 4px 0 6px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="settings.title">Light roles</h1>
    <p class="intro" data-i18n="settings.intro">
      Every light is main unless you say otherwise. Flow cards can target main or ambient lights
      separately. Excluded lights are never touched by any card, whatever it targets.
    </p>
    <div id="zones"></div>

    <script type="text/javascript">
      var ROLES = [
        { id: "ambient", label: "settings.ambient" },
        { id: "excluded", label: "settings.excluded" },
      ];
      var zones = [];
      var roles = {};

      function onHomeyReady(Homey) {
        Homey.api("GET", "/lights", null, function (err, result) {
          if (err) return Homey.alert(err);
          zones = result || [];
          roles = {};
          zones.forEach(function (zone) {
            zone.lights.forEach(function (light) {
              if (light.role !== "main") {
                roles[light.id] = light.role;
              }
            });
          });
          render(Homey);
          Homey.ready();
        });
      }

      function save(Homey) {
        Homey.api("PUT", "/roles", roles, function (err) {
          if (err) return Homey.alert(err);
        });
      }

      function render(Homey) {
        var container = document.getElementById("zones");
        container.innerHTML = "";

        zones.forEach(function (zone) {
          var section = document.createElement("div");
          section.className = "zone";

          var heading = document.createElement("h2");
          heading.textContent = zone.name;
          section.appendChild(heading);

          ROLES.forEach(function (role) {
            section.appendChild(renderRole(Homey, zone, role));
          });

          container.appendChild(section);
        });
      }

      function renderRole(Homey, zone, role) {
        var block = document.createElement("div");
        block.className = "role";

        var heading = document.createElement("h3");
        heading.textContent = Homey.__(role.label);
        block.appendChild(heading);

        var assigned = zone.lights.filter(function (light) {
          return roles[light.id] === role.id;
        });

        if (assigned.length === 0) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = Homey.__("settings.none");
          block.appendChild(empty);
        } else {
          var table = document.createElement("table");
          assigned.forEach(function (light) {
            var row = table.insertRow();
            row.insertCell().textContent = light.name;
            var cell = row.insertCell();
            cell.className = "trash";
            var button = document.createElement("button");
            button.className = "trash";
            button.title = Homey.__("settings.backToMain");
            button.textContent = "🗑";
            button.onclick = function () {
              delete roles[light.id];
              save(Homey);
              render(Homey);
            };
            cell.appendChild(button);
          });
          block.appendChild(table);
        }

        var available = zone.lights.filter(function (light) {
          return roles[light.id] == null;
        });

        var select = document.createElement("select");
        var placeholder = document.createElement("option");
        placeholder.textContent =
          available.length === 0 ? Homey.__("settings.noneLeft") : Homey.__("settings.add");
        placeholder.value = "";
        select.appendChild(placeholder);
        available.forEach(function (light) {
          var option = document.createElement("option");
          option.value = light.id;
          option.textContent = light.name;
          select.appendChild(option);
        });
        select.disabled = available.length === 0;
        select.onchange = function () {
          if (!select.value) return;
          roles[select.value] = role.id;
          save(Homey);
          render(Homey);
        };
        block.appendChild(select);

        return block;
      }
    </script>
  </body>
</html>
